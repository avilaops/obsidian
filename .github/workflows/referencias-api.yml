name: Organizar referencias de API
on:
  workflow_dispatch:
  push:
    paths:
      - 'Conhecimento/Clippings/API/*.md'
      - 'tools/import_api.py'
permissions:
  contents: read
jobs:
  organizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dividir recortes
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          for source in sorted(Path('Conhecimento/Clippings/API').glob('*.md')):
              subprocess.run(['python', 'tools/import_api.py', str(source), '--service', source.stem, '--output', 'resultado/APIs'], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: referencias-api
          path: resultado/
          if-no-files-found: warn
